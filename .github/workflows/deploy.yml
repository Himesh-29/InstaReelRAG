name: Deploy 24x7 App to Oracle Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: CLOUDFLARE_TUNNEL_TOKEN
          command_timeout: 120m
          script: |
            cd ~/InstaReelRAG
            git fetch origin main
            git reset --hard origin/main
            git lfs pull
            
            # Remove old token if it exists, then append the new one from GitHub Secrets
            sed -i '/CLOUDFLARE_TUNNEL_TOKEN/d' .env || true
            echo "CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN" >> .env
            
            docker compose up --build -d
            docker system prune -f
