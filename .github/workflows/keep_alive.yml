name: Oracle VM Idle Reclamation Preventer

on:
  schedule:
    # Run at 12:00 UTC every 3 days
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Gradio UI HTTPS Endpoint
        run: |
          if [ -n "${{ secrets.APP_URL }}" ]; then
            curl -sLf "${{ secrets.APP_URL }}" > /dev/null || echo "Ping attempted"
          else
            echo "APP_URL repository secret not set yet; skipping scheduled ping."
          fi
