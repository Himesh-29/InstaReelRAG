[project]
name = "instareelrag"
version = "0.1.0"
description = "A simple, multi-layer RAG implementation for Instagram content."
authors = [
    { name = "Himesh", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "sentence-transformers",
    "openai",
    "instaloader",
    "sqlalchemy",
    "python-dotenv",
    "opencv-python-headless",
    "tqdm",
    "rich",
    "gradio",
    "imageio-ffmpeg",
    "torch>=2.0.0",
    "torchvision",
    "torchaudio"
]

[project.optional-dependencies]
# For CUDA GPU acceleration on NVIDIA graphics cards (Windows/Linux)
# To upgrade/replace an existing CPU PyTorch build with CUDA GPU PyTorch, run:
#   python -m pip install --upgrade --force-reinstall torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124
# Or for fresh installs:
#   python -m pip install -e ".[gpu]" --extra-index-url https://download.pytorch.org/whl/cu124
gpu = [
    "torch>=2.0.0",
    "torchvision",
    "torchaudio"
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "database", "processing", "rag", "scraper"]
py-modules = ["main"]

[tool.setuptools.package-data]
config = ["*.json"]
